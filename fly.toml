# fly launch --no-deploy   (once, to claim a name)
# fly deploy
#
# Renders are CPU-bound and single-threaded per job, so a shared-cpu-1x will
# take ~15s per animation instead of ~5s. Bump to performance-2x for a demo.
app = "manimhint"
primary_region = "bos"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  RENDER_CACHE_DIR = "/data/cache"
  RENDER_WORK_DIR = "/data/jobs"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1          # keep 1 warm: a cold start mid-demo is fatal

  [http_service.concurrency]
    type = "requests"
    hard_limit = 8
    soft_limit = 4

[[vm]]
  size = "performance-2x"           # 2 vCPU / 4GB. shared-cpu-1x renders ~3x slower.

[[mounts]]
  source = "manimhint_data"
  destination = "/data"
