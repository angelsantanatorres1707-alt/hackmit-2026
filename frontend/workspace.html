<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noema — Your problems</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="workspace.css">
</head>
<body class="step-page">

<header class="topbar">
  <div class="brand">
    <a href="index.html"><img class="brand-logo" src="logo.png" alt="Noema" width="545" height="200"></a>
  </div>
  <div class="topbar-right">
    <nav class="navbar" aria-label="Main">
      <a href="workspace.html" class="is-here" aria-current="page">Workspace</a>
      <a href="about.html">What is Noema?</a>
      <a href="faq.html">FAQ</a>
    </nav>
  </div>
</header>

<main>
  <div class="step-bloom" aria-hidden="true"></div>

  <ol class="progress" aria-label="Progress">
    <li class="is-here" aria-current="step"><span>1</span>Your problems</li>
    <li><span>2</span>Your work</li>
    <li><span>3</span>The animation</li>
  </ol>

  <section class="stepbox">
    <h1>What are you stuck on?</h1>
    <p class="step-lede">
      Add the problem you&rsquo;re struggling with &mdash; or the whole set, and pick one next.
    </p>

    <div class="add" id="add" tabindex="0" role="button" aria-label="Add a problem">
      <input type="file" id="add-file" accept="image/*,.heic,.heif,application/pdf,.pdf" multiple hidden>
      <svg class="add-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M14 30a8 8 0 0 1 .9-15.9 11 11 0 0 1 20.8 3.1A7.5 7.5 0 0 1 35 32"/>
        <path d="M24 34V20M18 26l6-6 6 6"/>
      </svg>
      <p class="add-title">Drop a photo or screenshot</p>
      <p class="add-sub">image or PDF &mdash; one problem, or a whole set. You can paste too.</p>
      <div class="add-actions">
        <button class="ws-btn" type="button" id="add-browse">Choose a file</button>
        <button class="ws-btn" type="button" id="add-camera">Camera</button>
        <button class="ws-btn" type="button" id="add-type">Type it instead</button>
      </div>
      <div class="add-drop-hint">Drop to add</div>

      <a class="go is-off" id="go-next" href="solve.html" aria-label="Continue">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
      </a>
    </div>

    <div class="typer" id="typer" hidden>
      <textarea id="typer-text" rows="3"
        placeholder="Type the problem, e.g. Row-reduce [A|b] to reduced row echelon form, where A = [1 2 -1; 2 1 1; 3 3 0] and b = [2; 5; 7]."></textarea>
      <div class="typer-bar">
        <button class="ws-btn" type="button" id="typer-voice">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>Dictate
        </button>
        <span class="typer-spacer"></span>
        <button class="ws-btn" type="button" id="typer-cancel">Cancel</button>
        <button class="ws-btn is-primary" type="button" id="typer-add" disabled>Add problem</button>
      </div>
    </div>

    <div class="cam" id="cam" hidden>
      <video id="cam-video" playsinline muted></video>
      <div class="cam-bar">
        <button class="ws-btn" type="button" id="cam-shot">Take photo</button>
        <button class="ws-btn" type="button" id="cam-stop">Close camera</button>
      </div>
    </div>

    <ul class="probs" id="probs"></ul>

    <div class="step-foot">
      <button class="ws-btn" type="button" id="clear-all" hidden>Start over</button>
    </div>
  </section>
</main>

<div class="ws-toast" id="ws-toast" hidden></div>

<script src="store.js"></script>
<script src="pdfpages.js"></script>
<script src="problems.js"></script>
</body>
</html>
